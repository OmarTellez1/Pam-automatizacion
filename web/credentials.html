<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurar credenciales del PAM · Accesos PAM</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell shell-form">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Volver al inicio de Accesos PAM">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>
            <strong>Accesos PAM</strong>
            <small>BeyondInsight Password Safe</small>
          </span>
        </a>
        <a class="back-link" href="/">← Volver al inicio</a>
      </header>

      <section class="credentials-content" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">Configurar credenciales del PAM</h1>
        <div id="configured-message" class="configured-message" role="status" hidden>
          Ya tienes credenciales del PAM configuradas.
        </div>
        <section class="form-card" aria-label="Formulario de credenciales del PAM">
          <form id="credentials-form">
            <div class="field">
              <label for="username">Usuario</label>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                maxlength="256"
                required
                placeholder="Escribe tu usuario"
              />
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <div class="secret-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  maxlength="4096"
                  required
                  placeholder="Escribe tu contraseña"
                />
                <button class="reveal-button" type="button" data-reveal="password" aria-label="Mostrar contraseña">
                  Mostrar
                </button>
              </div>
            </div>

            <div class="field">
              <label for="totpSecret">Codigo alfanumerico del Two-Factor Authentication del pam</label>
              <div class="secret-field">
                <input
                  id="totpSecret"
                  name="totpSecret"
                  type="password"
                  autocomplete="off"
                  minlength="16"
                  maxlength="256"
                  required
                  placeholder="Clave Base32 de enrolamiento"
                />
                <button
                  class="reveal-button"
                  type="button"
                  data-reveal="totpSecret"
                  aria-label="Mostrar clave del Authenticator"
                >
                  Mostrar
                </button>
              </div>
              <p class="field-help">
                Usa la clave alfanumérica de configuración. No ingreses el código temporal de 6 dígitos.
              </p>
            </div>

            <div id="form-result" class="form-result" role="status" aria-live="polite" hidden></div>

            <button id="save-button" class="button button-primary button-submit" type="submit">
              <span>Guardar y probar acceso</span>
              <span aria-hidden="true">→</span>
            </button>
          </form>
        </section>
      </section>
    </main>
    <script src="/credentials.js" defer></script>
  </body>
</html>
